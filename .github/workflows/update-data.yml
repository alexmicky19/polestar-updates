name: Update Polestar software data

on:
  schedule:
    # Weekly, Mondays 07:13 UTC (off-peak minute to avoid the top-of-hour rush).
    - cron: "13 7 * * 1"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape manuals and regenerate index.html
        run: python3 scripts/scrape.py

      - name: Commit changes if any
        id: commit
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes — Polestar data is up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Detect genuinely NEW versions per model by diffing each data/<slug>.json
          # against its committed version. Emits a JSON array of {slug,label,version}
          # so the notifier can open one issue per new release (not per reworded note).
          new_json=$(python3 - <<'PY'
          import json, subprocess, pathlib, re
          MODELS = {"polestar-2": "Polestar 2", "polestar-3": "Polestar 3"}
          new = []
          for slug, label in MODELS.items():
              p = pathlib.Path(f"data/{slug}.json")
              if not p.exists():
                  continue
              cur = json.loads(p.read_text(encoding="utf-8"))
              try:
                  old_txt = subprocess.check_output(
                      ["git", "show", f"HEAD:data/{slug}.json"], text=True, stderr=subprocess.DEVNULL)
                  old = {v["version"] for v in json.loads(old_txt)}
              except Exception:
                  # No committed baseline yet (first run / newly added model): this is a
                  # bootstrap import, not a release. Skip notifications for it.
                  continue
              for v in cur:
                  if v["version"] not in old:
                      new.append({"slug": slug, "label": label, "version": v["version"]})
          print(json.dumps(new))
          PY
          )
          echo "new versions: ${new_json}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Human-readable commit summary of the latest version per model.
          summary=$(python3 -c "import json,glob,os; parts=[]; [parts.append(os.path.basename(f)[:-5]+' '+json.load(open(f))[0]['version']) for f in sorted(glob.glob('data/*.json'))]; print(', '.join(parts))")
          git commit -m "chore: update Polestar software data (${summary})"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"
          # multiline output for the notifier
          {
            echo "new_versions<<EOF"
            echo "${new_json}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open an issue per new version
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const news = JSON.parse(${{ toJSON(steps.commit.outputs.new_versions) }} || '[]');
            if (!news.length) { core.info('No new versions — nothing to notify.'); return; }
            const manuals = {
              'polestar-2': 'https://www.polestar.com/uk/manual/polestar-2/2027/software-updates/',
              'polestar-3': 'https://www.polestar.com/uk/manual/polestar-3/2025/software-updates/',
            };
            for (const nv of news) {
              const data = JSON.parse(fs.readFileSync(`data/${nv.slug}.json`, 'utf8'));
              const entry = data.find(v => v.version === nv.version) || { notes: [] };
              const notes = (entry.notes || [])
                .map(n => n.startsWith('### ') ? `\n**${n.slice(4)}**` : `- ${n}`)
                .join('\n');
              const body = [
                `A new **${nv.label}** software version **${nv.version}** was detected and committed.`,
                '',
                '## Release notes',
                notes || '_(no notes)_',
                '',
                '---',
                `- [${nv.label} owner's manual — Software updates](${manuals[nv.slug]})`,
                '- [Tracker site](https://alexmicky19.github.io/polestar-updates/)',
                '',
                '_Opened automatically by the update-data workflow._',
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `New ${nv.label} software version: ${nv.version}`,
                body,
              });
              core.info(`Opened issue for ${nv.label} ${nv.version}`);
            }
